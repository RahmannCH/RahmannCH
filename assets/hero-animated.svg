  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="420" y="24" text-anchor="middle" class="text-title">⚡ rahmannch@ulm-workspace: ~/profile.ts</text>

