<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .header { fill: #161b22; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; fill: #8b949e; font-weight: 500; }
    .code { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; font-size: 14px; }
    .keyword { fill: #ff7b72; font-weight: 600; }
    .variable { fill: #79c0ff; }
    .property { fill: #d2a8ff; }
    .string { fill: #a5d6ff; }
    .accent { fill: #00ffff; font-weight: bold; }
    .cursor {
      animation: blink 1s infinite;
      fill: #00ffff;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .neon-glow {
      filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.4));
    }
  </style>

  <!-- Window Container -->
