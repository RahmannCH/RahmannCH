    </text>

    <!-- Line 3 -->
    <text y="52">
      &nbsp;&nbsp;<tspan class="property">status</tspan>: <tspan class="string">"CS Student @ Lambung Mangkurat University"</tspan>,
    </text>

    <!-- Line 4 -->
