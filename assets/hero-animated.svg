    </text>

    <!-- Line 5 -->
    <text y="104">
      &nbsp;&nbsp;<tspan class="property">flagship</tspan>: <tspan class="accent neon-glow">"Zadify - Islamic Super-App"</tspan>
    </text>

    <!-- Line 6 -->
    <text y="130">
      };<rect x="24" y="118" width="8" height="15" class="cursor"/>
